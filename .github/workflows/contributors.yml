name: Update contributors

# Refresh the CONTRIBUTORS block in README.md from the repository's git history.
# Runs on tag pushes (right after a release) and on demand -- never on ordinary
# commits, so it can never loop with itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Regenerate contributors in README
        run: bash scripts/contributors.sh

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet README.md; then
            echo "README already lists every contributor"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update contributors [skip nightly] [skip ci]"
          git push
