name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install plenary.nvim
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim \
            ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
      - name: Run tests
        run: nvim --headless -c "PlenaryBustedDirectory tests/ {sequential=true}" -c "qa!"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update help file
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          DOC_FILE="doc/p5-nvim.txt"

          if [ -f "$DOC_FILE" ]; then
            sed -i "1s/^\\*p5\\.nvim\\*/*p5.nvim* (v${TAG_NAME#v})/" "$DOC_FILE"
            git config --local user.name "github-actions[bot]"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git add "$DOC_FILE"
            git commit -m "chore: bump version to ${TAG_NAME#v}" || true
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
