name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          releases=$(gh release list --json tagName -q '.[:-1] | .[].tagName')
          for release in $releases; do
            echo "Deleting release: $release"
            gh release delete "$release" --yes
          done

      - name: Delete old tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_tag=${GITHUB_REF#refs/tags/}
          all_tags=$(git tag -l)
          for tag in $all_tags; do
            if [ "$tag" != "$current_tag" ]; then
              echo "Deleting tag: $tag"
              git push origin --delete "$tag" 2>/dev/null || true
            fi
          done

      - name: Update help file
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          DOC_FILE="doc/p5-nvim.txt"

          if [ -f "$DOC_FILE" ]; then
            sed -i "1s/^\\*p5\\.nvim\\*/*p5.nvim* (v${TAG_NAME#v})/" "$DOC_FILE"
            git config --local user.name "github-actions[bot]"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git add "$DOC_FILE"
            git commit -m "chore: bump version to ${TAG_NAME#v}" || true
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
