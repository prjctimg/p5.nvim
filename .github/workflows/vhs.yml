name: VHS

on:
  push:
    paths:
      - 'assets/tapes/*.tape'
      - 'assets/init.lua'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      NVIM_APPNAME: nvim-p5-ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Setup Neovim config
        run: |
          mkdir -p ~/.config/nvim-p5-ci
          cp assets/init.lua ~/.config/nvim-p5-ci/init.lua

      - name: Install deps
        run: |
          sudo apt-get install -y python3 python3-websockets curl
          for repo in nvim-lua/plenary.nvim folke/snacks.nvim folke/tokyonight.nvim; do
            name="${repo##*/}"
            git clone --depth 1 "https://github.com/$repo" "/tmp/lazy-deps/$name"
          done

      - name: Install VHS
        uses: charmbracelet/vhs-action@v2
        with:
          path: ''

      - name: Generate & publish GIFs
        run: |
          for tape in assets/tapes/*.tape; do
            echo "Generating GIF from $tape"
            # Symlink p5.nvim checkout so lazy.nvim finds it
            mkdir -p ~/.local/share/nvim-p5-ci/lazy
            ln -sf "$PWD" ~/.local/share/nvim-p5-ci/lazy/p5.nvim
            # Seed deps into lazy's directory (avoids re-cloning)
            for dep in plenary.nvim snacks.nvim tokyonight.nvim; do
              src="/tmp/lazy-deps/$dep"
              dst="$HOME/.local/share/nvim-p5-ci/lazy/$dep"
              [ -d "$src" ] && ln -sf "$src" "$dst"
            done
            vhs "$tape"
          done
          for gif in assets/*.gif; do
            name=$(basename "$gif" .gif)
            url=$(vhs publish "$gif")
            echo "Published $name -> $url"
            sed -i "s|!\\[$name\\]([^)]*\\.gif)|![$name]($url)|" README.md
          done

      - name: Commit updated README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update VHS GIFs and README [skip ci]"
          file_pattern: 'README.md'
