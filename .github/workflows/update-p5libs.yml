name: Update p5.js Libraries

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

jobs:
  update-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Scrape libraries
        run: |
          python << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import re
          from datetime import datetime

          url = "https://p5js.org/libraries/"
          response = requests.get(url)
          soup = BeautifulSoup(response.text, "html.parser")

          libs = []
          for card in soup.select(".library-card, .col-lg-4, .card"):
              name_elem = card.select_one("h3, .card-title, h5")
              desc_elem = card.select_one("p, .card-text")
              
              if name_elem:
                  name = name_elem.get_text(strip=True)
                  description = desc_elem.get_text(strip=True) if desc_elem else ""
                  
                  libs.append({
                      "name": name,
                      "description": description,
                      "category": "",
                      "github_repo": "",
                      "github_release": "latest",
                      "asset_pattern": "",
                      "cdn_fallback": ""
                  })

          data = {
              "last_updated": datetime.now().strftime("%Y-%m-%d"),
              "libraries": libs
          }

          with open("libs.json", "w") as f:
              json.dump(data, f, indent=2)

          print(f"Found {len(libs)} libraries")
          EOF

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update p5.js libraries"
          title: "Update p5.js Libraries"
          body: "Automated update of p5.js contributor libraries"
          branch: "feat/update-libs"
