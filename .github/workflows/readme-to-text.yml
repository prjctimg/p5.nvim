name: Convert README to Text

on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Convert README.md to text
        run: pandoc -t plain -o p5.nvim.txt README.md

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add p5.nvim.txt
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "docs: update p5.nvim.txt"
          git push
