<!DOCTYPE html>
<html>
<head>
    <title>Test Console Streaming</title>
</head>
<body>
    <h1>HTTP Console Streaming Test</h1>
    <button onclick="testConsole()">Test Console</button>
    <div id="output"></div>
    <script>
        function testConsole() {
            console.log("Test log message from browser");
            console.error("Test error message from browser");
            console.warn("Test warning message from browser");
            console.info("Test info message from browser");
            
            // Test uncaught error
            setTimeout(() => {
                const error = new Error("Test uncaught error");
                throw error;
            }, 100);
        }
    </script>
</body>
</html>
